services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
      POSTGRES_DB: fieldops
    ports:
      - "5433:5432"
    volumes:
      - fieldops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: fieldops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fieldops
      MINIO_ROOT_PASSWORD: fieldopssecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fieldops_minio_data:/data
    profiles:
      - storage

volumes:
  fieldops_pg_data:
  fieldops_minio_data:
