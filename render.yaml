# Site et API FieldOps. La base PostgreSQL est sur Supabase.
services:
  - type: web
    name: fieldops-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate -w @fieldops/api && npm run build -w @fieldops/api
    startCommand: npm run start -w @fieldops/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        value: https://fieldops-web.onrender.com

  - type: web
    name: fieldops-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @fieldops/web
    startCommand: npm exec -w @fieldops/web -- next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fieldops-api
          envVarKey: RENDER_EXTERNAL_URL
